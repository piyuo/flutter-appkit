name: flutter_appkit
description: Production-ready runtime and infrastructure support for Flutter apps — error handling, logging, locale, context, Riverpod, and more.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 3.4.3
homepage: https://github.com/piyuo/flutter-appkit/

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  sentry_flutter: ^9.26.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  flutter_riverpod: ^3.4.2
  talker: ^5.1.20
  talker_flutter: ^5.1.20
  talker_riverpod_logger: ^5.1.20
  flutter_dotenv: ^6.0.1
  universal_io: ^2.3.1
  liquid_glass_widgets: ^0.29.2
dev_dependencies:
  analyzer: ^12.1.0
  sentry_dart_plugin: ^3.2.1
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  mockito: ^5.6.4
  flutter_lints: ^6.0.0
#dependency_overrides:
  #analyzer: ^10.0.1
  #meta: ^1.11.0 #cause flutter_test blocked

# The following section is specific to Flutter.
flutter:
    generate: true
    uses-material-design: true
    # To add assets to your package, add an assets section, like this:
    assets:
    - .env.test
sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: piyuo